# Daily NAV / risk update: rebuilds data/portfolio.json after the US close and deploys the site
name: Update portfolio data

on:
  schedule:
    # 21:30 UTC, Monday–Friday: after the 16:00 New York close (20:00 UTC summer, 21:00 UTC winter)
    - cron: "30 21 * * 1-5"
    # 23:30 UTC backup, in case Yahoo is late or the first run is delayed or dropped
    - cron: "30 23 * * 1-5"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write   # commit data/portfolio.json

concurrency:
  group: "update-portfolio"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Build data/portfolio.json
        run: python scripts/update_portfolio.py

      - name: Commit if changed
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- data/portfolio.json)" ]; then
            echo "No change in data/portfolio.json"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/portfolio.json
          git commit -m "Update portfolio data ($(date -u +%Y-%m-%d))"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Pushes made with GITHUB_TOKEN do not trigger static.yml, so deploy Pages here.
  # Manual runs always redeploy.
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Same group as static.yml, so the two never deploy at the same time
    concurrency:
      group: "pages"
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main   # includes the data commit pushed by the update job
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

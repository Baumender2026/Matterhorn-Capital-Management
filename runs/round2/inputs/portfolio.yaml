# Round 2 portfolio: the TE target and the stocks. Read by scripts/build_round2_portfolio.py.
# Run it after the stock pages are built for the same as_of.
# The steps of the TA's notebook (02_round2_lecture.ipynb §6-§10): Treynor-Black weights inside the active portfolio A,
# its optimal size w_A*, pushed inside the TE budget; every ETF to (1 - w_A) x its SAA weight, each stock to w_A x w_i.

as_of: 2026-11-06      # price date of the trades: the close of Friday 6 November, which Bloomberg uses for PRTU

te_target: 0.03        # the largest ex-ante tracking error vs the SAA we accept (budget 2-5%; the TA uses 4%, safely
                       # inside 5%). w_A = Treynor-Black's w_A*, kept between 2% / TE per unit and te_target / TE per unit

negative_weights: zero # a stock whose Treynor-Black weight is negative (negative alpha):
                       #   stop  the run stops and lists it (the default)
                       #   zero  the course rule (Checkpoint 1, the TA's clip at 0): entered as 0, its raw weight shown
                       #         and flagged, the positive weights rescaled to fill A

stocks: [NVDA, PEP, ABBV]    # the tickers, in report order (3 to 6; the report has 6 slots). Each needs
                       # runs/round2/<as_of>/<TICKER>_figures.json and _data.json from build_stock_report.py

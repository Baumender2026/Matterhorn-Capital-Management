# Stock report inputs. Copy this file to <TICKER>.yaml, fill it in, then run from the repo root:
#     python3 scripts/build_stock_report.py <TICKER>
# Final numbers: add --as-of 2026-11-06 on 7-8 November.
# Everything not listed here (prices, statements, multiples, beta, charts) is computed by the script.
#
# Text may use {tokens}, which update when you re-run, so never type a computed number by hand:
#   Prices     {P0} {V0} {V_ddm} {V_comp} {V_gordon} {V_ddm_beta1} {D0} {target}
#   Gaps       {mos} {mos_ddm} {mos_comp} {target_up} (margin of safety on fair value, DDM, comps; analyst target)
#   Discount   {k} {beta} {rf10} {erp} {g1} {g2} {T} {implied_g} {tv_share}
#   Grid       {grid_above} (cases of the sensitivity matrix at or above the price, e.g. "3 of 25")
#   Alpha      {alpha} {alpha_closed} {alpha_never} {ir}
#   Earnings   {eps_ago} {eps_cur} {eps_fwd} {eps_ttm} {eps_growth} {yield}
#   Multiples  {fpe} {fpe_med} {pfcf} {pfcf_med} {ev_ebitda} {ev_ebitda_med} {tpe} {pb} {pb_just}
#   Quality    {roe_fwd} {retention} {payout_fwd} {g_sust} {de} {payout_fcf} {red_flags} {verdict} {fy} {fy_prev}
# Use **double asterisks** for bold, and [1] [2] for the numbered sources at the bottom.
# Pages are fixed at two. If the text is too long the build stops and says which page, by how many pixels.
# Keep the text short: shorten it rather than shrinking the type.

name:                          # short company name; leave empty to use Yahoo's
peer_names: {}                 # optional display names, e.g. {CCEP: Coca-Cola Europacific}. The peers themselves are
                               # in the stock's sheet of DDM_valuation.xlsx (row 122 on), from Bloomberg RV

valuation:                     # every number of the DDM comes from the stock's sheet of DDM_valuation.xlsx: P0, D0, β (the
                               # override, else the 60-month β), rf, ERP, g1, T, g2, the method, the payout and the comps
                               # choices. Set them there first; this file holds only the text.
  g1_source: ""                # printed next to g1, e.g. "Bloomberg, long-term EPS growth (LTG)"
  T_source: ""
  g2_source: ""
  beta_source: ""              # optional, printed next to β, e.g. "Bloomberg BETA" when the sheet has a β override
  overrides: {}                # forward_eps only (the comps): {value: 4.10, source: "Bloomberg EE"}

alpha:
  probability_gap_closes: 1.0  # 1 is the TA's alpha closed: a catalyst closes the gap within a year.
                               # 0 is the TA's alpha never: no catalyst, or the value-trap check fails.
  rationale: ""                # why the gap closes, by when, and why this alpha is credible: about 210 characters

case:                          # section 1. The script fills in the margin of safety and alpha line, and the signal.
  value: ""                    # fair value against the price, and what the market has wrong: about 300 characters
  decision: ""                 # buy or not, and why: about 180 characters

catalysts:                     # 1 or 2 events, the central part of the analysis. The date must be 6 Nov to 27 Dec
  - event: ""
    date: 2026-12-01           # the date the flag checks, YYYY-MM-DD
    date_label: ""             # what is printed, e.g. "About 3 Dec (Yahoo)"
    why: ""                    # why it can happen before the end of December
    effect: ""                 # how it moves the price towards fair value. About 170 characters with why

method_text:
  why: ""                      # why this method suits the company: about 350 characters
  not_suitable: ""             # which methods are unsuitable or difficult, and why: about 270 characters
  sensitivity: ""              # a small comment on the matrix: where the DDM reaches the price, and what that says.
                               # About 200 characters. Re-read it after the final run, as the words do not update.

text:
  value_trap: ""               # your reading of the check, after the rule's verdict: about 250 characters.
                               # Cover management's use of capital here unless a specific issue does (Class 5 dossier).

issues:                        # 2 subchapters with your own titles; a third only if it fits. About 300 characters each.
  - title: ""                  # together they must cover the main risk and the upside potential, in the course's
    text: ""                   # terms where they apply: value trap, sustainable growth, management quality, activist
  - title: ""
    text: ""

sources:                       # numbered [1], [2] ... in the order listed
  - text: ""
    url: ""
